<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Estrattore personale</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; width: 360px; margin: 0; padding: 12px; color: #202124; }
    h3 { margin: 0 0 4px 0; font-size: 15px; }
    p { margin: 0 0 8px 0; font-size: 12px; color: #5f6368; }
    textarea { width: 100%; height: 150px; box-sizing: border-box; resize: vertical; font-family: Consolas, monospace; font-size: 11px; }
    button { width: 100%; padding: 8px; margin-top: 8px; background: #1a73e8; color: #fff; border: 0; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #1558b0; }
    button:disabled { background: #9aa0a6; cursor: default; }
    #stato { margin-top: 8px; font-size: 12px; min-height: 16px; }
    .ok { color: #188038; } .no { color: #c5221f; }
  </style>
</head>
<body>
  <h3>Elenco del personale</h3>
  <p>Vale sulla pagina <b>profilo &rarr; Network &rarr; Tutto il personale</b> di ClasseViva. Legge solo quello che vedi gi&agrave; tu.</p>
  <textarea id="risultato" placeholder="Sto leggendo la pagina..." readonly></textarea>
  <button id="copiaBtn" disabled>Copia per Campanella</button>
  <div id="stato"></div>
  <script src="popup.js"></script>
</body>
</html>
