# ===========================================================================
#  Campanella tests: on every push to a branch and on every pull request.
#
#  Builds Campanella.exe and the C# installer (build.ps1), runs every test
#  of the CI list with test\tutte.ps1 (which fails if any single test fails
#  or is missing), then compiles the Inno Setup installer to catch errors in
#  installer\Campanella.iss before a release tag. Nothing is published:
#  read-only token, no secrets.
#
#  Actions are pinned to a full commit SHA, with the version in a comment;
#  .github/dependabot.yml proposes the updates once a month.
# ===========================================================================
name: Prove

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: Build and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Build Campanella.exe and the C# installer
        shell: powershell
        run: .\build.ps1

      - name: Run all the tests of the CI list
        shell: powershell
        run: .\test\tutte.ps1

      - name: Compile the Inno Setup installer (not published)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version 6.7.1 --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with code $LASTEXITCODE" }
          }
          $uscita = & $iscc installer\Campanella.iss
          $codice = $LASTEXITCODE
          $uscita | ForEach-Object { Write-Host $_ }
          if ($codice -ne 0) { throw "ISCC failed with code $codice" }
          # the version that compiled this installer: the engine line of the log,
          # or the version resource of ISCC.exe; only Inno Setup 6 is accepted
          $versione = (Get-Item $iscc).VersionInfo.ProductVersion
          $motore = [regex]::Match(($uscita -join "`n"), 'Compiler engine version: Inno Setup (\d+(?:\.\d+)*)')
          if ($motore.Success) { $versione = $motore.Groups[1].Value }
          if (-not $versione) { throw 'Cannot tell which Inno Setup version compiled the installer' }
          Write-Host "Inno Setup used: $versione"
          if ($versione -notmatch '^6\.') { throw "Inno Setup 6 is required, found $versione" }
