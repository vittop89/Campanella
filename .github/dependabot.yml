# Once a month Dependabot checks the GitHub Actions used by the workflows,
# which are pinned to a full commit SHA with the version in a comment, and
# opens a single pull request that updates both. Nothing else to watch:
# Campanella has no NuGet, npm or pip packages.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      azioni:
        patterns: ['*']
